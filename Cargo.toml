[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/cli",
    "crates/frontend",
    "crates/render",
    "crates/schema",
    "crates/server",
    "crates/store",
]

# `askance-frontend` is the wasm half of the UI: it turns on `leptos/hydrate`,
# which cannot be unified with the `leptos/ssr` the server needs. cargo-leptos
# builds it on its own with `--package`, so keep it out of what a bare `cargo
# build` or `cargo test` at the root picks up.
default-members = [
    "crates/app",
    "crates/cli",
    "crates/render",
    "crates/schema",
    "crates/server",
    "crates/store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
askance-app = { path = "crates/app" }
# The view types alone, unless a dependant asks for `ssr` on top: the renderers
# are the server's, and the wasm half of the UI carries the types without them.
askance-render = { path = "crates/render", default-features = false }
askance-schema = { path = "crates/schema" }
askance-store = { path = "crates/store" }
# The Preface is agent-supplied markdown, so what pulldown-cmark renders is
# untrusted HTML and ammonia is not optional dressing.
ammonia = "4"
anyhow = "1"
# The VAPID keypair and a subscription's keys are base64url without padding
# throughout — that is the one encoding `PushManager.subscribe` and the Web Push
# protocol both speak.
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
console_error_panic_hook = "0.1"
# Reaching past web-sys, in the browser half only: whether a global is there at
# all — `Notification`, `PushManager` — which is how a browser without push is
# told from one that has it.
js-sys = "0.3"
leptos = "0.8"
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
# Generating the VAPID keypair, which is a P-256 one because Web Push says so.
# Default features off drops the ECDSA half: nothing here signs anything — the
# key is generated, encoded, and stored.
p256 = { version = "0.13", default-features = false, features = [
    "arithmetic",
    "std",
] }
# Default features off drops the getopts-based example binary: this is a
# library dependency of the server half only.
pulldown-cmark = { version = "0.13", default-features = false, features = [
    "html",
] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }
# The Diff is highlighted server-side. Default features off swaps oniguruma for
# the pure-Rust regex engine — no C dependency in the build — and drops the
# themes: the token classes are styled by the site's own stylesheet, so a
# bundled colour scheme would only be dead weight. The bundled syntaxes go the
# same way, in favour of `two-face`'s wider set below; what stays is the loader
# that reads it.
syntect = { version = "5", default-features = false, features = [
    "dump-load",
    "html",
    "parsing",
    "regex-fancy",
] }
tempfile = "3"
time = { version = "0.3", default-features = false, features = [
    "parsing",
    "std",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The syntaxes syntect bundles are Sublime Text's defaults, which is a set that
# stopped growing before TypeScript, TOML and Nix existed as far as it is
# concerned — a Diff of any of them came out unhighlighted. This is the set `bat`
# ships, the same defaults with those in it. `syntect-fancy` holds it to the
# pure-Rust regex engine our syntect line already chose.
two-face = { version = "0.5", default-features = false, features = [
    "syntect-fancy",
] }
# Pinned exactly: the bindgen format is unstable, so the wasm-bindgen crate has
# to match the one built into the cargo-leptos the flake pins. Bump the two
# together or the wasm build stops with a schema-version mismatch.
wasm-bindgen = "=0.2.100"
# Awaiting a JS promise from Rust: subscribing to push is four of them in a row.
wasm-bindgen-futures = "0.4"
# What the browser half needs and leptos's own web-sys does not turn on:
# `Storage`, because drafts live in `localStorage` and leptos enables
# `StorageEvent` but not `Storage` itself; `navigator.serviceWorker` to register
# the worker with; and the push manager that hangs off the registration, with
# the notification permission that governs it. `History` and
# `HtmlDetailsElement` are the table of contents': a jump records where it
# landed without adding a way back, and unfolds a folded file before it lands.
# The `IntersectionObserver` three are that same nav the other way round — the
# reader scrolling, and the browser saying which section they have reached.
web-sys = { version = "0.3", features = [
    "History",
    "HtmlDetailsElement",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "Navigator",
    "Notification",
    "NotificationPermission",
    "PushManager",
    "PushSubscription",
    "PushSubscriptionJson",
    "PushSubscriptionKeys",
    "PushSubscriptionOptionsInit",
    "ServiceWorkerContainer",
    "ServiceWorkerRegistration",
    "Storage",
    "Window",
] }

# cargo-leptos drives the build: it compiles `askance-frontend` to wasm, runs
# wasm-bindgen over it, processes the stylesheet, and then builds and runs the
# server binary that serves the result.
[[workspace.metadata.leptos]]
name = "askance"
bin-package = "askance-server"
lib-package = "askance-frontend"
style-file = "style/main.css"
# The manifest, the icons and the service worker, copied verbatim into the site
# root. They cannot live under `site-pkg-dir`: a service worker only controls
# the paths beneath the one it was served from, so a worker under `/pkg/` could
# never show a notification for `/sets/12`.
assets-dir = "assets"
site-root = "target/site"
site-pkg-dir = "pkg"
# Matches `Config`'s default listen address, so `cargo leptos watch` and a
# plain `askance-server` put the UI in the same place.
site-addr = "127.0.0.1:8422"
reload-port = 3001
lib-features = ["hydrate"]
lib-default-features = false
bin-features = []
# Content-hashed bundle names, written to `hash.txt` beside the binary and read
# back by the shell. The wasm and the HTML that hydrates it have to come from
# the same build: a browser holding a cached `askance.wasm` from an older one
# panics out of hydration and leaves a dead page, which is what an unhashed
# name under a stable URL invites. A new build is a new URL, so the two can no
# longer be mixed, and the cache is free to keep the old one forever.
hash-files = true

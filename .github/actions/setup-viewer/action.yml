# The viewer's toolchain, in one place. Both `ci.yml` and the release workflow
# need the same pnpm, the same Node and the same `--frozen-lockfile` install
# before they can run anything of the viewer's; carried in each workflow
# separately, those pins drift apart, and a check that passes against one
# toolchain while the artefact ships from another is the drift that matters.
#
# Setup and nothing past it: what the caller does with the installed viewer —
# CI typechecks and tests, the release workflow builds — differs by caller, so
# it stays with the caller.
name: Set up the viewer
description: Install the pinned pnpm and Node, then the viewer's dependencies.

runs:
  using: composite
  steps:
    # pnpm before node, because the node cache below asks pnpm where its store
    # is. 10.28.0 is the flake's, and `web/pnpm-lock.yaml` is
    # `lockfileVersion: 9.0` — whatever pnpm the runner image happens to ship
    # is not a version we have agreed to.
    - name: Install pnpm 10.28.0
      uses: pnpm/action-setup@v6.0.10
      with:
        version: 10.28.0

    # Also the flake's, down to the patch. `cache: pnpm` caches the pnpm store
    # keyed on the lockfile, so an unchanged lockfile means an install that
    # unpacks rather than downloads.
    - name: Install Node 22.22.2
      uses: actions/setup-node@v7.0.0
      with:
        node-version: 22.22.2
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml

    # `--frozen-lockfile` is the point of the step: a `package.json` that has
    # moved away from the lockfile fails here, rather than being quietly
    # resolved into whatever is newest today.
    #
    # `working-directory` is spelled out because a calling job's
    # `defaults.run.working-directory` does not reach inside a composite
    # action — the step would otherwise run at the repository root, where there
    # is no `package.json`. `shell` is likewise required of every `run` step in
    # a composite action.
    - name: Install
      run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: web

# The project's checks, run on GitHub so that what lands on `main` has passed
# them. Everything here is pinned — the actions to a released version, the
# runner to an image rather than `ubuntu-latest`, and Rust to a patch version —
# because a check that quietly moves under us is a check nobody is reading.
name: CI

# Pull requests and pushes to `main`, which between them cover every commit
# once. A branch with an open PR would run twice if pushes to it triggered as
# well, and a branch without one has nothing to guard yet.
on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything back; the default token would otherwise carry
# write access to the repository's contents.
permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      # The version branch _is_ the pin: `@1.91.1` installs exactly that
      # toolchain, where `@stable` would move whenever Rust released. 1.91.1 is
      # what the flake's nixpkgs (nixos-25.11) carries, so CI and the dev shell
      # compile with the same rustc.
      - name: Install Rust 1.91.1
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.9.2

      # Formatting and lints first: both are cheap and both fail on the kind of
      # thing that is quicker to read than a test failure.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The viewer is not built first. `web/dist` is gitignored and the embed
      # that reads it is `allow_missing`, so the crates compile without it —
      # what the viewer's own suite covers is the viewer job's business.
      - name: Test
        run: cargo test --workspace

      # `cargo test` writes `web/src/api/types.ts` through ts-rs — see
      # `.cargo/config.toml`. So a working tree that is no longer clean after
      # the run above means the committed wire types have drifted from the Rust
      # ones they are generated from, and the viewer is compiling against a
      # shape the server no longer sends.
      - name: Generated TypeScript is up to date
        run: |
          drift=$(git status --porcelain)
          if [ -n "$drift" ]; then
            echo "::error::Generated files drifted from the Rust types. Run 'cargo test' locally and commit the result."
            echo "Changed by the test run:"
            echo "$drift"
            git diff
            exit 1
          fi

  # The viewer's own checks, on the viewer's own sources. Nothing here waits on
  # the Rust job and nothing there waits on this one: neither produces anything
  # the other reads, so they run side by side.
  viewer:
    name: Viewer
    runs-on: ubuntu-24.04
    # Every step below is the viewer's, and `web/` is where its `package.json`
    # lives. Said once here rather than on each step.
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1

      # pnpm before node, because the node cache below asks pnpm where its store
      # is. 10.28.0 is the flake's, and `web/pnpm-lock.yaml` is
      # `lockfileVersion: 9.0` — whatever pnpm the runner image happens to ship
      # is not a version we have agreed to.
      - name: Install pnpm 10.28.0
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.28.0

      # Also the flake's, down to the patch. `cache: pnpm` caches the pnpm store
      # keyed on the lockfile, so an unchanged lockfile means an install that
      # unpacks rather than downloads.
      - name: Install Node 22.22.2
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # `--frozen-lockfile` is the point of the step: a `package.json` that has
      # moved away from the lockfile fails here, rather than being quietly
      # resolved into whatever is newest today.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Typecheck as well as test, for the reason `nix/web.nix` gives: a
      # component that only compiles because vite erases the types would pass
      # vitest and fail nobody, and the generated `web/src/api/types.ts` is only
      # worth generating if something checks the viewer against it.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

# A Question Set as an agent sends it.
#
#   askance ask examples/questions.yaml
#
# `project`, `branch` and `diff` are deliberately absent: the CLI derives them
# from the working directory and overwrites whatever a Set claims.

title: Rate limiting for the public API

preface: |
  `POST /v1/messages` has no rate limit. Last night one client sent 40k
  requests in a minute and the queue was backed up for twenty.

  I can land a limiter today, but two things are product calls rather than
  technical ones and the rest follows from them: where the counter lives,
  and what a throttled client is told. The scaffolding I have so far is in
  the attached Diff — nothing in it commits to either decision.

questions:
  - label: Q1
    text: Where should the request counter live?
    options:
      - n: 1
        text: >-
          In-process, per instance. No new dependency, but the effective
          limit multiplies by the instance count and resets on every deploy.
        recommended: true
      - n: 2
        text: >-
          In Redis, shared across instances. Exact, and survives deploys, at
          the cost of putting Redis on the request path.

  # Options with no Recommendation are fine: the agent is offering a choice
  # it has no preference between.
  - label: Q2
    text: How should a throttled client be told to back off?
    options:
      - n: 1
        text: A 429 with `Retry-After`, and nothing else.
      - n: 2
        text: >-
          A 429 with `Retry-After`, plus `RateLimit-*` headers on every
          response, so a client can pace itself before it is throttled.
    subquestions:
      - letter: a
        text: What should `Retry-After` say?
        options:
          - n: 1
            text: The exact number of seconds until the window resets.
          - n: 2
            text: >-
              A rounded number, so the header gives away less about how the
              limiter works.

  # A Question with no Options at all: the answer is whatever the human
  # writes. It asks for one specific missing fact — an account id nothing in
  # the codebase knows — rather than for anything else in general, which is
  # what the Postscript below is for.
  - label: Q3
    text: >-
      Which client account should the allowlist start with? I need the id to
      pin it in the config, and nothing in the repo names it.

# The Postscript: markdown the Set closes with, drawn above the comment box.
# Not a Question — it is where "anything else?" goes, and whatever the human
# writes under it (or doesn't) is the set-level comment. Open invitations
# only: a decision, however small, would be a Question above instead.
postscript: |
  Anything else you'd like to add, such as:

  * Context on the noisy clients I can't see from here
  * Anything about the rollout the Questions above miss

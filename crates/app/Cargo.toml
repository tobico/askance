[package]
name = "askance-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
serde.workspace = true
time.workspace = true

# The server half. `#[server]` compiles these bodies only under `ssr`, so the
# wasm build never sees sqlx or the store.
askance-store = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

[features]
hydrate = ["leptos/hydrate"]
ssr = [
    "dep:askance-store",
    "dep:leptos_axum",
    "dep:sqlx",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

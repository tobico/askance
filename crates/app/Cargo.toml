[package]
name = "askance-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# The view types alone. The renderers behind them are the server's, and the wasm
# half of this crate must not carry them, so they arrive with the `ssr` feature
# below and not before.
askance-render.workspace = true
askance-schema.workspace = true
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true

# The browser half. A draft only ever exists in front of a human, and so does a
# push subscription, so the server build has no use for `localStorage` or the
# push manager.
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }

# The server half. `#[server]` compiles these bodies only under `ssr`, so the
# wasm build never sees sqlx or the store — nor a markdown parser or a syntax
# highlighter, which is why the Preface and the Diff arrive already rendered.
askance-store = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

[features]
hydrate = [
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "leptos/hydrate",
]
ssr = [
    "askance-render/ssr",
    "dep:askance-store",
    "dep:leptos_axum",
    "dep:sqlx",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

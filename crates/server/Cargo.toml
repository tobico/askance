[package]
name = "askance-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
# The rendering behind the viewer's namespace, and the types it answers with.
askance-render.workspace = true
askance-schema.workspace = true
askance-store.workspace = true
axum = "0.8"
base64.workspace = true
clap.workspace = true
# The request `web-push-native` builds is an `http::Request`, and this is the
# crate that type comes from — shared with reqwest and axum, so it is the same
# request all the way out.
http = "1"
# Signing the VAPID header, which the store's keypair half of the dependency
# does not need: `ecdsa` is what turns the stored private key into a signature.
p256 = { workspace = true, features = ["ecdsa"] }
# Sending the push, and asking GitHub whether a newer Askance has been released
# — between them the whole of what Askance says to the public internet. Default
# features are off to keep OpenSSL out of the build: rustls, with the roots it
# bundles, is all that reaching an https endpoint takes. `json` is what reads
# GitHub's answer, and costs nothing beyond the serde_json already here.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
# The viewer built into the binary — see `src/viewer.rs`. `mime-guess` is what
# names each file's content type on the way out; `interpolate-folder-path` is what
# lets the folder be written relative to this manifest rather than to whatever
# directory cargo was run from. `debug-embed` is deliberately *off*: in a debug
# build the files are then read off disk per request, so a `pnpm build` is visible
# to a running `cargo run -p askance-cli -- serve` without a recompile.
rust-embed = { version = "8", features = [
    "interpolate-folder-path",
    "mime-guess",
] }
# Comparing the latest release's tag against the version this was built as.
semver.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["signal", "sync", "time"] }
# The Nudge stream is a broadcast channel turned into a `Stream` for axum's SSE
# response, which is the `sync` feature and nothing else here uses.
tokio-stream = { version = "0.1", features = ["sync"] }
# The events only; where they go is the starting binary's call, so the
# subscriber is the CLI's dependency rather than this crate's — see
# `crates/cli/src/serve.rs`.
tracing = "0.1"
# The aes128gcm encryption a push body has to be in. Default features off
# leaves out its VAPID half, which pulls a whole JWT stack in for what is one
# ES256 signature over two claims — p256 is already here to make it. 0.4 rather
# than 0.5 for the same reason: 0.5's hashing is a generation ahead of the one
# p256 uses, and would put two of every crypto crate in the tree.
web-push-native = { version = "0.4", default-features = false }

[dev-dependencies]
http-body-util = "0.1"
serde-saphyr.workspace = true
tempfile.workspace = true
# `test-util` for the runtime's own clock: a keep-alive is a quarter-minute
# apart, and no test should spend that waiting for one.
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

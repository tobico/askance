[package]
name = "askance-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
askance-schema.workspace = true
# The push identity: generated here, because the store is where "on first run"
# happens, and handed out already encoded.
base64.workspace = true
p256.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
# For the grace window on a released wait: the one place the store has a clock
# of its own rather than letting SQLite stamp the time.
time.workspace = true
# For `Settlements` only: the announcement that a Set has been settled has to
# cross from whichever crate took the Response — or archived the Set — to
# whichever is holding a wait.
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
serde-saphyr.workspace = true
tempfile.workspace = true
